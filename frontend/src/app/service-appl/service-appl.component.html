<main class="main">

    <div class="page-title m-3" data-aos="fade"  >
      <div class="container">
        <h2 class="text-primary fw-bold text-center"> Application Form</h2>
        <hr class="border-1 w-50 border-dark m-auto">
      </div>
    </div>

    <section id="contact" class="contact section ">
        <div class="container position-relative" data-aos="fade-up" data-aos-delay="100">
            <div class="row gy-4">
            
                <div class=" col-lg-3">
                </div>
                
                <div class="card shadow-lg col-lg-6 p-1">
                
                
                    <form class=" p-5 "  method="post" enctype="multipart/form-data" >
                        <div class="row gy-4">
                                <h4 class="text-center fw-bold text-secondary">Apply For {{services.title}}</h4>
                            <div class="">

                            <h5>Applicant Details:</h5>
                            <input type="text" class="m-2 form-control" placeholder="Your Name" [value]="user.username" [(ngModel)]="user.username" name="citizen" readonly required/>
                            <input type="text" class=" m-2 form-control " [value]="user.phone" [(ngModel)]="user.phone" readonly placeholder="Phone Number" name="phone" required=""/>
                            <input type="text" class=" m-2 form-control " [value]="user.address" [(ngModel)]="user.address" readonly placeholder="Address" name="address" required=""/>
                            <input class=" m-2 form-control"  [value]="services.title" [(ngModel)]="services.title" name="service" readonly required/>
                            
                            </div>
                            <div class="">
                            <h5>Issue Details:</h5>
                            <input type="text" class=" m-2 form-control" name="description" placeholder="Describe Your Need / Issue Briefly..." [(ngModel)]="application.description" required=""/>
                            <input type="text" class=" m-2 form-control" name="location" placeholder="Location..." [(ngModel)]="application.location" required=""/>
                            
                            </div>
                            <div class="">
                            <h5> Document upload:</h5>
                            <label>Attach Document:</label>
                            <input type="file" class=" m-2 form-control " (change)="onFile($event)" name="attachment" required="">
                            </div>
                        
                            <div class="text-center">
                            
                                <button class="btn btn-outline-info" type="submit" (click)="submit()">APPLY</button>
                            <a href="services" class="btn btn-outline-info m-3">  Back <i class="bi bi-arrow-left-circle"></i> </a>
                    
                            </div>

                        </div>
                    </form>
                    
                </div>

            </div>
        </div>
    </section>
</main>
